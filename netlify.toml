[build]
  base = "bfq-frontend"
  command = "npm run build"
  publish = ".next"
  SECRETS_SCAN_OMIT_KEYS = "AUDITOR_ADDRESS,NEXT_PUBLIC_AUDITOR_ADDRESS,CONTRACT_ADDRESS,NEXT_PUBLIC_CONTRACT_ADDRESS,CLEANVERSE_CVI_ADDRESS,CLEANVERSE_CVA_ADDRESS,MONAD_USDC_ADDRESS,VALIDATOR_POOL_OWNER_ADDRESS,CLEANVERSE_BASE_URL,MONAD_RPC_URL,CHAIN_NAME,CHAIN_ID,NEXT_PUBLIC_REOWN_PROJECT_ID,REOWN_PROJECT_ID,DEPLOYER_PRIVATE_KEY,CLEANVERSE_VALIDATOR_OWNER_PRIVATE_KEY"

[context.production.environment]
  SECRETS_SCAN_OMIT_KEYS = "AUDITOR_ADDRESS,NEXT_PUBLIC_AUDITOR_ADDRESS,CONTRACT_ADDRESS,NEXT_PUBLIC_CONTRACT_ADDRESS,CLEANVERSE_CVI_ADDRESS,CLEANVERSE_CVA_ADDRESS,MONAD_USDC_ADDRESS,VALIDATOR_POOL_OWNER_ADDRESS,CLEANVERSE_BASE_URL,MONAD_RPC_URL,CHAIN_NAME,CHAIN_ID,NEXT_PUBLIC_REOWN_PROJECT_ID,REOWN_PROJECT_ID,DEPLOYER_PRIVATE_KEY,CLEANVERSE_VALIDATOR_OWNER_PRIVATE_KEY"

[[plugins]]
  package = "@netlify/plugin-nextjs"
